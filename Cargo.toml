[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/license-issuance",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
encoding_rs = "0.8"
qrcode = "0.14"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
checkout-core = { path = "crates/core" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
