name: Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/ci.yml
  android:
    uses: ./.github/workflows/android.yml
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="build-${GITHUB_SHA::8}"; fi
          gh release delete "$TAG" -y >/dev/null 2>&1 || true
          mapfile -t assets < <(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.apk' \))
          printf '%s\n' "${assets[@]}"
          gh release create "$TAG" "${assets[@]}" --generate-notes --title "$TAG"
