name: Auto Format

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            crates/**/*.rs
            Cargo.toml
            crates/**/Cargo.toml
          if-no-files-found: error
