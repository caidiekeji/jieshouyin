name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

jobs:
  core-quality:
    name: Rust fmt / clippy / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (core + issuance + app, all targets)
        run: cargo clippy -p checkout-core -p license-issuance -p checkout-app --all-targets -- -D warnings
      - name: cargo test (core + issuance + app)
        run: cargo test -p checkout-core -p license-issuance -p checkout-app --all-targets

  build-app:
    name: Tauri 2 Windows x64 build
    runs-on: windows-latest
    needs: core-quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend deps
        working-directory: ui
        run: npm ci
      - name: Build frontend
        working-directory: ui
        run: npm run build
      - name: Build Tauri app with installers
        working-directory: crates/app
        env:
          # 内置官网/激活服务地址，发行包开箱即用；仓库变量可覆盖
          ACTIVATION_ENDPOINT: ${{ vars.ACTIVATION_ENDPOINT || 'https://www.lequ.pw' }}
          # 正式公钥与指纹已作为源码常量内嵌（crates/core/build.rs），构建不依赖任何变量。
          # 以下变量仅用于密钥轮换时临时覆盖：留空即用内嵌正式公钥；
          # 一旦提供公钥，release 仍强制校验指纹一致，防止误配。私钥只在激活 Worker Secret。
          CHECKOUT_PUBLIC_KEY: ${{ vars.CHECKOUT_PUBLIC_KEY }}
          CHECKOUT_PUBLIC_KEY_FINGERPRINT: ${{ vars.CHECKOUT_PUBLIC_KEY_FINGERPRINT }}
          # 轮换期旧公钥：保留上一把公钥，让新旧 key_id 的激活码都能验签。
          CHECKOUT_PUBLIC_KEY_2: ${{ vars.CHECKOUT_PUBLIC_KEY_2 }}
          CHECKOUT_PUBLIC_KEY_2_FINGERPRINT: ${{ vars.CHECKOUT_PUBLIC_KEY_2_FINGERPRINT }}
        run: npx -y @tauri-apps/cli@2 build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: checkout-r-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/checkout-app.exe
          if-no-files-found: error
