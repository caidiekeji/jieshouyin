name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  core-quality:
    name: Rust fmt / clippy / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (core + issuance + app, all targets)
        run: cargo clippy -p checkout-core -p license-issuance -p checkout-app --all-targets -- -D warnings
      - name: cargo test (core + issuance + app)
        run: cargo test -p checkout-core -p license-issuance -p checkout-app --all-targets

  build-app:
    name: Tauri 2 Windows x64 build
    runs-on: windows-latest
    needs: core-quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend deps
        working-directory: ui
        run: npm ci
      - name: Build frontend
        working-directory: ui
        run: npm run build
      - name: Build Tauri app with installers
        working-directory: crates/app
        env:
          # 内置官网/激活服务地址，发行包开箱即用；仓库变量可覆盖
          ACTIVATION_ENDPOINT: ${{ vars.ACTIVATION_ENDPOINT || 'https://www.lequ.pw' }}
          # 生产 Ed25519 公钥（64 位 hex）：release 构建缺失会直接失败，必须配在仓库 Secrets。
          # 未配置时 build.rs 会 panic，不会静默把 DEV 公钥打进安装包。
          CHECKOUT_PUBLIC_KEY: ${{ secrets.CHECKOUT_PUBLIC_KEY }}
        run: npx -y @tauri-apps/cli@2 build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: checkout-r-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/checkout-app.exe
          if-no-files-found: error
